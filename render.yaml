# Render Blueprint — one free Docker web service for the API.
# Apply with: Render Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: yt-clip-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Comma-separated list of frontend origins allowed by CORS (your Vercel URL).
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the API's HTML error pages link back to (your Vercel URL).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_CONCURRENT_STREAMS
        value: "2"
      - key: JS_RUNTIME
        value: deno
      # Bundled bgutil PO-token server (started by start.sh); set empty to disable.
      - key: POT_PROVIDER_URL
        value: http://127.0.0.1:4416
      # yt-dlp clients tried in order; TV/embedded clients are gated differently from web ones
      # on flagged datacenter IPs. bgutil attests all but visionos.
      - key: YTDLP_PLAYER_CLIENTS
        value: tv_simply,tv_downgraded,web_embedded,mweb,visionos
      # "always" also attaches a player PO token, which is what clears YouTube's bot check.
      - key: YTDLP_FETCH_POT
        value: always
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
