# Render Blueprint — one free Docker web service for the API.
# Apply with: Render Dashboard → New → Blueprint → select this repository.
services:
  - type: web
    name: yt-clip-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Comma-separated list of frontend origins allowed by CORS (your Vercel URL).
      - key: ALLOWED_ORIGINS
        sync: false
      # Where the API's HTML error pages link back to (your Vercel URL).
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MAX_CONCURRENT_STREAMS
        value: "2"
      - key: JS_RUNTIME
        value: deno
      # Bundled bgutil PO-token server (started by start.sh); set empty to disable.
      - key: POT_PROVIDER_URL
        value: http://127.0.0.1:4416
      # yt-dlp clients tried in order: yt-dlp's logged-in defaults first (cookies below), then
      # mweb (attested by bgutil) and the token-free visionos.
      - key: YTDLP_PLAYER_CLIENTS
        value: web_embedded,tv_downgraded,mweb,visionos
      # "always" also attaches a player PO token, not only the media-URL one.
      - key: YTDLP_FETCH_POT
        value: always
      # YouTube's bot check on Render's IPs is cleared by a browser-session cookies file (a
      # logged-out guest session, or a spare account): upload it as a Secret File named
      # cookies.txt (Dashboard -> Environment -> Secret Files), then set
      #   YTDLP_COOKIES_FILE=/etc/secrets/cookies.txt
      # in the Dashboard. See README -> Clear YouTube's bot check with a cookies file.
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: "1"
